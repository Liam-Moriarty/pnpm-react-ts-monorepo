name: Preview

on:
  pull_request:
    branches:
      - main
      - dev
      - stage

permissions:
  contents: read
  pull-requests: write # to comment the preview URL

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Pull requests from forks don't get secrets, so they can't deploy.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm turbo run build

      # The token is missing until the Vercel secrets are added, and always on
      # Dependabot PRs, which get Dependabot secrets instead of Actions secrets.
      - name: Check for a Vercel token
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::VERCEL_TOKEN is not available to this run, so no preview is deployed."
          fi

      - name: Deploy preview to Vercel and comment the URL
        if: steps.vercel.outputs.configured == 'true'
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: apps/web
          github-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
