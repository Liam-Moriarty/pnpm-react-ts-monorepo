name: CD — Stage

on:
  push:
    branches:
      - stage

permissions:
  contents: read

# Deploys to the same environment run one at a time, in order.
concurrency:
  group: cd-stage
  cancel-in-progress: false

env:
  APP_NAME: 'web'

jobs:
  # -------------------------------------------------------
  # JOB 1 — Run all checks before deploying
  # -------------------------------------------------------
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm, Node and dependencies
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm turbo run lint --filter=${{ env.APP_NAME }}

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=${{ env.APP_NAME }}

      - name: Test
        run: pnpm turbo run test --filter=${{ env.APP_NAME }}

  # -------------------------------------------------------
  # JOB 2 — Deploy only if checks pass
  # -------------------------------------------------------
  deploy-stage:
    runs-on: ubuntu-latest
    needs: checks # ← waits for checks job to pass
    environment:
      name: staging
      url: ${{ vars.STAGE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm, Node and dependencies
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm turbo run build --filter=${{ env.APP_NAME }}
        env:
          VITE_APP_ENV: staging
          VITE_API_URL: ${{ secrets.STAGE_API_URL }}

      # -------------------------------------------------------
