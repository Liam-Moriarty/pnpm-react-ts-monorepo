name: CD — Dev

on:
  push:
    branches:
      - dev

permissions:
  contents: read

# Deploys to the same environment run one at a time, in order.
concurrency:
  group: cd-dev
  cancel-in-progress: false

env:
  APP_NAME: 'web' # ← change to your app name in apps/

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ vars.DEV_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm, Node and dependencies
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm turbo run lint --filter=${{ env.APP_NAME }}

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=${{ env.APP_NAME }}

      - name: Build
        run: pnpm turbo run build --filter=${{ env.APP_NAME }}
        env:
          VITE_APP_ENV: development
          VITE_API_URL: ${{ secrets.DEV_API_URL }}
          # Add more env vars here as needed
          # VITE_FIREBASE_KEY: ${{ secrets.DEV_FIREBASE_KEY }}

