name: CD — Production

on:
  push:
    branches:
      - main

env:
  PNPM_VERSION: '8'
  APP_NAME: 'web'

jobs:
  # -------------------------------------------------------
  # JOB 1 — Full checks (strictest for production)
  # -------------------------------------------------------
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm turbo run lint --filter=${{ env.APP_NAME }}

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=${{ env.APP_NAME }}

      - name: Test
        run: pnpm turbo run test --filter=${{ env.APP_NAME }}

      - name: Build check
        run: pnpm turbo run build --filter=${{ env.APP_NAME }}
        env:
          VITE_APP_ENV: production
          VITE_API_URL: ${{ secrets.PROD_API_URL }}

  # -------------------------------------------------------
  # JOB 2 — Deploy to production (needs approval)
  # -------------------------------------------------------
  deploy-production:
    runs-on: ubuntu-latest
    needs: checks
    environment:
      name: production # ← set required reviewers in GitHub
      url: ${{ vars.PROD_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm turbo run build --filter=${{ env.APP_NAME }}
        env:
          VITE_APP_ENV: production
          VITE_API_URL: ${{ secrets.PROD_API_URL }}

