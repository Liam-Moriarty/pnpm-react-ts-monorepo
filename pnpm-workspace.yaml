packages:
  - 'apps/*'
  - 'packages/*'

# One version for every dependency shared by more than one package.
# Packages reference these with "catalog:" instead of a version range.
catalog:
  '@testing-library/dom': ^10.4.2
  '@testing-library/react': ^16.3.3
  '@types/node': ^26.6.6
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  eslint: ^10.13.0
  jsdom: ^30.1.3
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: 7.0.2
  vite: ^8.3.5
  vitest: ^5.0.5
